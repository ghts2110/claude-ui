# Config do claude-ui. Carregada com `tmux -f` num socket próprio,
# então não interfere no ~/.tmux.conf nem em outras sessões do usuário.

# Sessão efêmera: fechar o terminal encerra tudo.
set -g destroy-unattached on
set -g exit-empty on

# Sem prefixo: Ctrl-b e afins continuam chegando ao Claude Code.
set -g prefix None
set -g prefix2 None
unbind C-b

# Cores e teclas iguais às do terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g escape-time 0
set -g focus-events on
set -g extended-keys on
set -as terminal-features ",*:extkeys"
set -g allow-passthrough on

# Layout: sem barra de status, o sidebar acompanha o tamanho da janela.
set -g status off
set -g window-size latest
set -g aggressive-resize on
set -g mouse on
set -g history-limit 50000
set -g pane-border-lines single
set -g pane-border-style "fg=#6b7280"
# Como no workmux, a borda do pane com o foco fica no tom de destaque do
# sidebar: dá para ver se as teclas vão para ele ou para a conversa.
set -g pane-active-border-style "fg=#0891b2"
set -g pane-border-indicators colour

# Conversa que termina ou pede resposta apita (ver sidebar/status.js): o bell
# de qualquer janela, inclusive das conversas fora da tela, chega ao terminal
# como bell de verdade, não como aviso na barra de status.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# Ctrl-Z suspenderia o claude sem um shell para trazê-lo de volta.
bind -n C-z display-message "Ctrl-Z não funciona no claude-ui (use 'command claude')"

# Ctrl-\ alterna o foco entre o sidebar e a conversa na tela (o pane de baixo
# à direita; o de cima é o cabeçalho); com o sidebar escondido (zoom na
# conversa), o traz de volta.
bind -n 'C-\' if -F '#{==:#{pane_id},#{@sidebar}}' { select-pane -t '{bottom-right}' } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; select-pane -t '{left}' }

# Esc e Ctrl-C interrompem o claude, e o Claude Code não tem hook para isso:
# a conversa que estava trabalhando ou esperando passa a "pronto" (ver
# sidebar/status.js), sem apitar depois quando chegar o aviso de ociosidade.
# O tempo no sidebar recomeça (@desde; a última tecla do terminal é agora).
# Os dois também calam a leitura em voz alta (pid da fala em @fala, ver
# sidebar/voz.js).
bind -n Escape { if -F '#{||:#{==:#{@status},trabalhando},#{==:#{@status},esperando}}' { set -p @status pronto ; set -pF @desde '#{client_activity}' } ; if -F '#{@fala}' { run-shell -b 'kill #{@fala}' } ; send-keys Escape }
bind -n C-c { if -F '#{||:#{==:#{@status},trabalhando},#{==:#{@status},esperando}}' { set -p @status pronto ; set -pF @desde '#{client_activity}' } ; if -F '#{@fala}' { run-shell -b 'kill #{@fala}' } ; send-keys C-c }
